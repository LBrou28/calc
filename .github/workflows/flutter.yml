name: Flutter build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: 'Check 1 - Addition (2 + 2 = 4)'
        run: flutter test --plain-name 'Addition:'
      - name: 'Check 2 - Subtraction (9 - 3 = 6)'
        run: flutter test --plain-name 'Subtraction:'
      - name: 'Check 3 - Multiplication (6 x 2 = 12)'
        run: flutter test --plain-name 'Multiplication:'
      - name: 'Check 4 - Division (12 / 4 = 3)'
        run: flutter test --plain-name 'Division:'
      - name: 'Check 5 - Clear resets calculator state'
        run: flutter test --plain-name 'Clear:'
      - name: 'Check 6 - Decimals, backspace, error recovery, and sign'
        run: flutter test --plain-name 'Input:'
      - name: Build release web app
        run: flutter build web --release
      - name: Save web build
        uses: actions/upload-artifact@v4
        with:
          name: calc-web
          path: build/web
          if-no-files-found: error
